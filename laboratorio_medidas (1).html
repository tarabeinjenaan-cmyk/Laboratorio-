<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Laboratorio Medidas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#F5F4F0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#1A1A18;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding-bottom:100px}
.header{background:#fff;border-bottom:1px solid rgba(0,0,0,0.08);padding:16px 16px 0;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header-top h1{font-size:22px;font-weight:700;letter-spacing:-0.3px}
.right-badges{display:flex;gap:8px;align-items:center}
.pill{font-size:13px;font-weight:600;color:#5F5E5A}
.unit{font-size:12px;padding:4px 10px;background:#EEEDE9;border-radius:20px;color:#5F5E5A}
.pbar{height:3px;background:#E8E7E3;border-radius:2px;margin-bottom:10px;overflow:hidden}
.pfill{height:100%;background:#1D9E75;border-radius:2px;transition:width 0.3s}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nbtn{flex-shrink:0;width:48px;height:48px;border-radius:10px;border:1.5px solid #D3D1C7;background:#F5F4F0;font-size:13px;font-weight:700;color:#888780;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nbtn.active{background:#1A1A18;color:#fff;border-color:#1A1A18}
.nbtn.done{border-color:#1D9E75;color:#0F6E56;background:#E1F5EE}
.nbtn.active.done{background:#1D9E75;color:#fff;border-color:#1D9E75}
.content{padding:12px}
.card{background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card-header{padding:14px 16px;border-bottom:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;gap:8px}
.card-icon{font-size:18px}
.card-title{font-size:15px;font-weight:700}
.eblock{padding:14px 16px;border-bottom:1px solid rgba(0,0,0,0.06)}
.eblock:last-child{border-bottom:none}
.elabel{font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#9B9A96;margin-bottom:12px}
.drow{margin-bottom:12px}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.dname{font-size:15px;font-weight:500;color:#1A1A18}
.abadge{font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px;background:#E1F5EE;color:#0F6E56;min-width:80px;text-align:center}
.abadge.empty{background:#EEEDE9;color:#9B9A96}
.irow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.iwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.iwrap input{width:100%;height:56px;padding:0 6px;font-size:18px;font-weight:600;border:2px solid #D3D1C7;border-radius:10px;background:#F5F4F0;color:#1A1A18;text-align:center;-webkit-appearance:none;appearance:none}
.iwrap input:focus{outline:none;border-color:#1D9E75;background:#fff}
.iwrap input::placeholder{color:#B4B2A9;font-size:14px;font-weight:400}
.inum{font-size:11px;color:#9B9A96;font-weight:500}
.sbox{background:#F5F4F0;border-radius:10px;padding:10px 12px;margin-top:10px}
.slabel{font-size:11px;color:#9B9A96;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}
.sgrid{display:grid;gap:6px}
.sgrid.three{grid-template-columns:1fr 1fr 1fr}
.sgrid.two{grid-template-columns:1fr 1fr}
.sitem{background:#fff;border-radius:8px;padding:8px 6px;text-align:center;border:1px solid rgba(0,0,0,0.06)}
.slbl{font-size:11px;color:#9B9A96;margin-bottom:2px}
.sval{font-size:16px;font-weight:700;color:#1A1A18}
.btnrow{display:grid;gap:8px;margin-top:4px}
.btnrow.two{grid-template-columns:1fr 1fr}
.btnrow.one{grid-template-columns:1fr}
.btn{height:54px;border-radius:12px;border:1.5px solid #D3D1C7;background:#fff;font-size:15px;font-weight:600;color:#1A1A18;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none}
.btn:active{opacity:0.7}
.btn.primary{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn.primary:active{background:#0F6E56}
.btn.danger{border-color:#E24B4A;color:#E24B4A}
.exparea{padding:0 12px;display:flex;flex-direction:column;gap:8px}
.expbtn{width:100%;height:56px;border-radius:12px;border:1.5px solid #D3D1C7;background:#fff;font-size:15px;font-weight:600;color:#1A1A18;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none}
.expbtn:active{background:#F5F4F0}
.clearbtn{width:100%;height:48px;border-radius:12px;border:1.5px solid #F09595;background:#fff;font-size:14px;font-weight:600;color:#E24B4A;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none}
.clearbtn:active{background:#FCEBEB}
.toast{padding:14px;background:#E1F5EE;border-radius:10px;font-size:14px;font-weight:600;color:#0F6E56;display:none;text-align:center}
.saved-dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;display:inline-block;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <h1>Laboratorio <span class="saved-dot" id="saveddot" title="Datos guardados"></span></h1>
      <div class="right-badges">
        <span class="pill" id="ppill">0/19</span>
        <span class="unit">mm</span>
      </div>
    </div>
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="content" id="content"></div>
  <div class="exparea">
    <button class="expbtn" onclick="exportData()">&#11015; Exportar todos los datos</button>
    <button class="clearbtn" onclick="clearAll()">&#128465; Borrar todos los datos</button>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
var POINTS=19;
var VD=['Longitud','Ancho','Altura'];
var CD=['Diametro','Altura'];
var NV=3, NC=2, cur=1, D={};
var STORAGE_KEY='lab_medidas_v1';

function init(){
  // Intentar cargar datos guardados
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if(saved) {
      D = JSON.parse(saved);
      // Verificar que tenga todos los puntos
      var ok = true;
      for(var p=1;p<=POINTS;p++) if(!D[p]) { ok=false; break; }
      if(ok) return;
    }
  } catch(e) {}
  // Si no hay datos o están corruptos, inicializar de cero
  D = {};
  for(var p=1;p<=POINTS;p++){
    D[p]={v:[],c:[]};
    for(var i=0;i<NV;i++){
      D[p].v[i]={};
      for(var di=0;di<VD.length;di++) D[p].v[i][VD[di]]=['','',''];
    }
    for(var j=0;j<NC;j++){
      D[p].c[j]={};
      for(var di=0;di<CD.length;di++) D[p].c[j][CD[di]]=['','',''];
    }
  }
}

function save(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(D));
    // Parpadeo del punto verde
    var dot = document.getElementById('saveddot');
    if(dot){ dot.style.background='#97C459'; setTimeout(function(){ dot.style.background='#1D9E75'; },300); }
  } catch(e) {}
}

function clearAll(){
  if(!confirm('Seguro que quieres borrar TODOS los datos? Esta accion no se puede deshacer.')) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  D={};
  init();
  cur=1;
  navRender();
  renderPoint();
  showToast('Datos borrados correctamente','#FCEBEB','#A32D2D');
}

function isDone(p){
  for(var i=0;i<NV;i++)
    for(var di=0;di<VD.length;di++)
      for(var k=0;k<3;k++) if(D[p].v[i][VD[di]][k]==='') return false;
  for(var j=0;j<NC;j++)
    for(var di=0;di<CD.length;di++)
      for(var k=0;k<3;k++) if(D[p].c[j][CD[di]][k]==='') return false;
  return true;
}

function avg(arr){
  var nums=[],n;
  for(var i=0;i<arr.length;i++){
    n=parseFloat((arr[i]+'').replace(',','.'));
    if(!isNaN(n)) nums.push(n);
  }
  if(!nums.length) return null;
  var s=0; for(var i=0;i<nums.length;i++) s+=nums[i];
  return s/nums.length;
}

function fmt(n){ return n===null?'--':n.toFixed(2); }

function navRender(){
  var nav=document.getElementById('nav'), sl=nav.scrollLeft, dn=0, html='';
  for(var p=1;p<=POINTS;p++){
    var d=isDone(p), cls='nbtn'+(p===cur?' active':'')+(d?' done':'');
    if(d) dn++;
    html+='<button class="'+cls+'" onclick="go('+p+')">P'+p+'</button>';
  }
  nav.innerHTML=html;
  nav.scrollLeft=sl;
  document.getElementById('ppill').textContent=dn+'/19';
  document.getElementById('pfill').style.width=Math.round(dn/POINTS*100)+'%';
}

function renderPoint(){
  var p=cur, html='';

  // VIGAS
  html+='<div class="card">';
  html+='<div class="card-header"><span class="card-icon">&#128208;</span><span class="card-title">Vigas &mdash; Punto '+p+'</span></div>';
  for(var v=0;v<NV;v++){
    html+='<div class="eblock"><div class="elabel">Viga '+(v+1)+'</div>';
    for(var di=0;di<VD.length;di++){
      var dim=VD[di], vals=D[p].v[v][dim], a=avg(vals);
      html+='<div class="drow">';
      html+='<div class="dhead"><span class="dname">'+dim+'</span>';
      html+='<span class="abadge'+(a===null?' empty':'')+'" id="bv'+p+'_'+v+'_'+di+'">'+(a===null?'--':fmt(a)+' mm')+'</span></div>';
      html+='<div class="irow">';
      for(var k=0;k<3;k++){
        html+='<div class="iwrap">';
        html+='<input type="text" inputmode="decimal" placeholder="0.00" value="'+(vals[k]||'')+'"';
        html+=' data-t="v" data-p="'+p+'" data-v="'+v+'" data-d="'+dim+'" data-di="'+di+'" data-i="'+k+'"';
        html+=' oninput="hi(this)" onfocus="this.select()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
        html+='<span class="inum">Med '+(k+1)+'</span></div>';
      }
      html+='</div></div>';
    }
    html+='<div class="sbox"><div class="slabel">Promedios viga '+(v+1)+'</div>';
    html+='<div class="sgrid three" id="sgv'+p+'_'+v+'">';
    for(var di=0;di<VD.length;di++){
      html+='<div class="sitem"><div class="slbl">'+VD[di]+'</div><div class="sval">'+fmt(avg(D[p].v[v][VD[di]]))+'</div></div>';
    }
    html+='</div></div></div>';
  }
  html+='</div>';

  // CILINDROS
  html+='<div class="card">';
  html+='<div class="card-header"><span class="card-icon">&#11093;</span><span class="card-title">Cilindros &mdash; Punto '+p+'</span></div>';
  for(var c=0;c<NC;c++){
    html+='<div class="eblock"><div class="elabel">Cilindro '+(c+1)+'</div>';
    for(var di=0;di<CD.length;di++){
      var dim=CD[di], vals=D[p].c[c][dim], a=avg(vals);
      html+='<div class="drow">';
      html+='<div class="dhead"><span class="dname">'+dim+'</span>';
      html+='<span class="abadge'+(a===null?' empty':'')+'" id="bc'+p+'_'+c+'_'+di+'">'+(a===null?'--':fmt(a)+' mm')+'</span></div>';
      html+='<div class="irow">';
      for(var k=0;k<3;k++){
        html+='<div class="iwrap">';
        html+='<input type="text" inputmode="decimal" placeholder="0.00" value="'+(vals[k]||'')+'"';
        html+=' data-t="c" data-p="'+p+'" data-c="'+c+'" data-d="'+dim+'" data-di="'+di+'" data-i="'+k+'"';
        html+=' oninput="hi(this)" onfocus="this.select()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
        html+='<span class="inum">Med '+(k+1)+'</span></div>';
      }
      html+='</div></div>';
    }
    html+='<div class="sbox"><div class="slabel">Promedios cilindro '+(c+1)+'</div>';
    html+='<div class="sgrid two" id="sgc'+p+'_'+c+'">';
    for(var di=0;di<CD.length;di++){
      html+='<div class="sitem"><div class="slbl">'+CD[di]+'</div><div class="sval">'+fmt(avg(D[p].c[c][CD[di]]))+'</div></div>';
    }
    html+='</div></div></div>';
  }
  html+='</div>';

  // BOTONES
  var hasPrev=p>1, hasNext=p<POINTS;
  html+='<div class="btnrow '+(hasPrev&&hasNext?'two':'one')+'">';
  if(hasPrev) html+='<button class="btn" onclick="go('+(p-1)+')">&#8592; Anterior</button>';
  if(hasNext) html+='<button class="btn primary" onclick="go('+(p+1)+')">Siguiente &#8594;</button>';
  html+='</div>';

  document.getElementById('content').innerHTML=html;
}

function hi(el){
  var p=parseInt(el.dataset.p), i=parseInt(el.dataset.i), dim=el.dataset.d, val=el.value;
  if(el.dataset.t==='v'){
    var v=parseInt(el.dataset.v), di=parseInt(el.dataset.di);
    D[p].v[v][dim][i]=val;
    var a=avg(D[p].v[v][dim]);
    var b=document.getElementById('bv'+p+'_'+v+'_'+di);
    if(b){b.textContent=a===null?'--':fmt(a)+' mm'; b.className='abadge'+(a===null?' empty':'');}
    var g=document.getElementById('sgv'+p+'_'+v);
    if(g){var its=g.querySelectorAll('.sval'); for(var d=0;d<VD.length;d++) if(its[d]) its[d].textContent=fmt(avg(D[p].v[v][VD[d]]));}
  } else {
    var c=parseInt(el.dataset.c), di=parseInt(el.dataset.di);
    D[p].c[c][dim][i]=val;
    var a=avg(D[p].c[c][dim]);
    var b=document.getElementById('bc'+p+'_'+c+'_'+di);
    if(b){b.textContent=a===null?'--':fmt(a)+' mm'; b.className='abadge'+(a===null?' empty':'');}
    var g=document.getElementById('sgc'+p+'_'+c);
    if(g){var its=g.querySelectorAll('.sval'); for(var d=0;d<CD.length;d++) if(its[d]) its[d].textContent=fmt(avg(D[p].c[c][CD[d]]));}
  }
  save();
  navRender();
}

function go(p){ cur=p; navRender(); renderPoint(); window.scrollTo(0,0); }

function showToast(msg, bg, color){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=bg||'#E1F5EE';
  t.style.color=color||'#0F6E56';
  t.style.display='block';
  setTimeout(function(){ t.style.display='none'; },3000);
}

function exportData(){
  var lines=['REPORTE DE MEDIDAS - LABORATORIO','Unidades: milimetros (mm)',''];
  for(var p=1;p<=POINTS;p++){
    lines.push('=== PUNTO '+p+' ===');
    lines.push('VIGAS:');
    for(var v=0;v<NV;v++){
      lines.push('  Viga '+(v+1)+':');
      for(var di=0;di<VD.length;di++){
        var d=VD[di];
        lines.push('    '+d+': '+D[p].v[v][d].join(' | ')+'  -> Prom: '+fmt(avg(D[p].v[v][d]))+' mm');
      }
    }
    lines.push('CILINDROS:');
    for(var c=0;c<NC;c++){
      lines.push('  Cilindro '+(c+1)+':');
      for(var di=0;di<CD.length;di++){
        var d=CD[di];
        lines.push('    '+d+': '+D[p].c[c][d].join(' | ')+'  -> Prom: '+fmt(avg(D[p].c[c][d]))+' mm');
      }
    }
    lines.push('');
  }
  var text=lines.join('\n');
  function show(){ showToast('Copiado al portapapeles!'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(show).catch(function(){ fb(text,show); });
  } else { fb(text,show); }
}

function fb(text,cb){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;font-size:16px;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  cb();
}

init(); navRender(); renderPoint();
</script>
</body>
</html>
